<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | Galeniole</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #e954b0 0%, #3487be 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
      padding: 2rem 1rem;
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      padding: 3rem 2rem;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    .logo {
      font-size: 2rem;
      font-weight: 700;
      color: #2563eb;
      margin-bottom: 0.5rem;
    }

    h2 {
      color: #1f2937;
      font-weight: 600;
      margin-bottom: 2rem;
      font-size: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
      text-align: left;
    }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 1rem;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      outline: none;
      transition: all 0.3s ease;
      font-size: 0.95rem;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .password-strength {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      display: none;
    }

    .password-strength.show {
      display: block;
    }

    .strength-bar {
      height: 4px;
      background: #e5e7eb;
      border-radius: 2px;
      margin-top: 0.25rem;
      overflow: hidden;
    }

    .strength-fill {
      height: 100%;
      transition: all 0.3s ease;
      border-radius: 2px;
    }

    .submit-btn {
      background: linear-gradient(135deg, #2563eb, #10b981);
      color: white;
      padding: 1rem;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s ease;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      margin-top: 0.5rem;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(37, 99, 235, 0.3);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .switch-link {
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: #6b7280;
    }

    .switch-link a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }

    .switch-link a:hover {
      text-decoration: underline;
    }

    .back-home {
      display: inline-block;
      margin-top: 1rem;
      color: #6b7280;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.3s ease;
    }

    .back-home:hover {
      color: #2563eb;
    }

    .message {
      padding: 0.75rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      display: none;
    }

    .message.success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #10b981;
    }

    .message.error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #ef4444;
    }

    .message.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Galeniole</div>
    <h2>Create Your Account ✨</h2>
    
    <div id="message" class="message"></div>
    
    <form id="signupForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your full name" required minlength="2" />
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password" required minlength="8" />
        <div class="password-strength" id="passwordStrength">
          <div class="strength-bar">
            <div class="strength-fill" id="strengthFill"></div>
          </div>
          <span id="strengthText"></span>
        </div>
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter your password" required />
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">Sign Up</button>
      <div class="switch-link">
        Already have an account? <a href="login.html">Login</a>
      </div>
      <a href="index.html" class="back-home">← Back to Home</a>
    </form>
  </div>

<script>
const signupForm = document.getElementById('signupForm');
const submitBtn = document.getElementById('submitBtn');
const messageDiv = document.getElementById('message');
const passwordInput = document.getElementById('password');
const confirmPasswordInput = document.getElementById('confirmPassword');
const strengthDiv = document.getElementById('passwordStrength');
const strengthFill = document.getElementById('strengthFill');
const strengthText = document.getElementById('strengthText');

function showMessage(text, type) {
  messageDiv.textContent = text;
  messageDiv.className = `message ${type} show`;
  setTimeout(() => {
    messageDiv.classList.remove('show');
  }, 5000);
}

// Password strength checker
passwordInput.addEventListener('input', function() {
  const password = this.value;
  if (password.length === 0) {
    strengthDiv.classList.remove('show');
    return;
  }

  strengthDiv.classList.add('show');
  let strength = 0;

  if (password.length >= 8) strength += 25;
  if (password.match(/[a-z]/)) strength += 25;
  if (password.match(/[A-Z]/)) strength += 25;
  if (password.match(/[0-9]/)) strength += 15;
  if (password.match(/[^a-zA-Z0-9]/)) strength += 10;

  let color, text;
  if (strength < 40) {
    color = '#ef4444';
    text = 'Weak';
  } else if (strength < 70) {
    color = '#f59e0b';
    text = 'Medium';
  } else {
    color = '#10b981';
    text = 'Strong';
  }

  strengthFill.style.width = strength + '%';
  strengthFill.style.background = color;
  strengthText.textContent = text;
  strengthText.style.color = color;
});

signupForm.addEventListener('submit', async function(e) {
  e.preventDefault();

  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = passwordInput.value;
  const confirmPassword = confirmPasswordInput.value;

  // Validation
  if (password !== confirmPassword) {
    showMessage('Passwords do not match!', 'error');
    return;
  }

  if (password.length < 8) {
    showMessage('Password must be at least 8 characters long!', 'error');
    return;
  }

  // Disable button during submission
  submitBtn.disabled = true;
  submitBtn.textContent = 'Creating Account...';

  try {
    const response = await fetch("/signup", {  // adjust if your router has a prefix
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, email: email, password: password })
    });

    if (response.ok) {
      const result = await response.json();

      // Show success message
      showMessage('Account created successfully! Redirecting to login...', 'success');
      submitBtn.textContent = 'Success ✓';

      // Redirect to login page
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 2000);
    } else {
      const err = await response.json();
      throw new Error(err.detail || 'Registration failed');
    }
  } catch (error) {
    console.error('Signup error:', error);
    showMessage(error.message, 'error');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Sign Up';
  }
});
</script>
</body>
</html>
